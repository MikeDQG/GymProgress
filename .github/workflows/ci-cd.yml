name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/
      - name: Package and check backend image
        run: |
          docker build --build-arg APP_REVISION="$GITHUB_SHA" -f backend/Dockerfile -t gymprogress-api:"$GITHUB_SHA" .
          docker run -d --name api -p 127.0.0.1:3001:3001 -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_PUBLISHABLE_KEY=test gymprogress-api:"$GITHUB_SHA"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3001/api/health || { docker logs api; exit 1; }
          docker save gymprogress-api:"$GITHUB_SHA" | gzip > backend-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          compression-level: 0
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test]
    environment:
      name: production
      url: ${{ steps.pages.outputs.page_url }}
    concurrency: production-deployment
    runs-on: ubuntu-latest
    permissions:
      packages: write
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
      - name: Publish verified backend image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api:$GITHUB_SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i backend-image.tar.gz
          docker tag gymprogress-api:"$GITHUB_SHA" "$image"
          docker push "$image"
          echo "IMAGE_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_ENV"
      - name: Deploy backend and verify revision
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          curl --fail --silent --show-error --get --data-urlencode "imgURL=$IMAGE_REF" "$HOOK" --output /dev/null
          for attempt in {1..60}; do
            if curl -fsS --max-time 10 "$API_URL/api/health" | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha' > /dev/null; then
              curl -fsS --retry 3 "$API_URL/api/health/auth" | jq -e '.reachable == true'
              exit 0
            fi
            sleep 5
          done
          echo "Render did not serve the expected revision."
          exit 1
      - name: Deploy frontend
        id: pages
        uses: actions/deploy-pages@v4
